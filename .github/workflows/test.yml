name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # .claude/rules/testing.md: core logic is developed on Linux first;
    # cross-platform verification (especially Windows, where the
    # rename-based .overwrite dance has OS-specific constraints) is owned
    # by this matrix rather than the local dev environment. PLAN.md's
    # Phase 1 completion criteria require this matrix green with
    # Windows's .overwrite specifically exercised, so `make test` (e2e)
    # runs here too, not just `make check`.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # windows-latest has no GNU Make preinstalled; ubuntu/macos do.
      - name: Install make (Windows)
        if: runner.os == 'Windows'
        run: choco install make -y

      - name: make check
        run: make check
        shell: bash

      - name: make test (e2e)
        run: make test
        shell: bash

  race:
    # -race requires cgo (a C compiler). ubuntu-latest/macos-latest ship
    # one preinstalled; windows-latest does not have MinGW by default, so
    # it is intentionally excluded here rather than added to `check`'s
    # matrix (.claude/rules/testing.md "-race の運用方針").
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: make race
        run: make race
        shell: bash

  trivy:
    # .claude/rules/testing.md: known-vulnerability (CVE) and license
    # compatibility (MIT/BSD/Apache-2.0 allowed, GPL-family rejected)
    # checks for dependencies. Source-copy-paste detection is out of
    # scope (left to human review).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Intentionally not pinned to a specific patch beyond the major
      # release: a vulnerability scanner needs a current CVE database
      # more than build reproducibility.
      - name: Run trivy (vulnerabilities + license check)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scanners: vuln,license
          severity: HIGH,CRITICAL
          exit-code: "1"
